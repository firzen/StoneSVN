name: Stable Release
run-name: "${{ inputs.validate_only && 'Validate' || 'Release' }} stable · ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Check and build all platforms without creating a tag or release
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/tauri.conf.json
      - docs/releases/**

permissions:
  contents: read

# Serialize publishing; independent dry-run candidates can be checked concurrently.
concurrency:
  group: ${{ inputs.validate_only && format('release-check-{0}', github.sha) || 'stable-release' }}
  cancel-in-progress: false

env:
  NODE_VERSION: "lts/*"
  RUST_BACKTRACE: 1

jobs:
  plan:
    name: Pin candidate and validate release metadata
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      proceed: ${{ steps.plan.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check candidate without creating tags
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE_ONLY: ${{ inputs.validate_only || false }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          tag="v$(node -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Already published versions are ordinary main-branch development.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate > "$RUNNER_TEMP/releases.json"
          published=$(jq --arg tag "$tag" '[.[] | select(.tag_name == $tag and .draft == false)] | length' "$RUNNER_TEMP/releases.json")
          if [ "$published" != 0 ] && [ "$VALIDATE_ONLY" != true ]; then
            echo "Version $tag is already published; no release required."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run release:check -- "$tag"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  desktop:
    name: Test and build (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.proceed == 'true'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf subversion
      - name: Install SVN on Windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install sliksvn --version=1.14.5 --no-progress -y --package-parameters="/InstallDir=C:\Tools\SlikSvn"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $svnBin = 'C:\Tools\SlikSvn\bin'
          foreach ($tool in @('svn.exe', 'svnadmin.exe')) {
            $executable = Join-Path $svnBin $tool
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "SVN installation is missing $executable"
            }
            & $executable --version --quiet
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $svnBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Enable UTF-8 in the CI SVN process
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # The English hosted runner uses an ANSI code page. SlikSVN 1.14
          # needs a per-process UTF-8 manifest for multilingual CLI arguments.
          # Only the disposable test tool is changed; SVN is not bundled.
          $svn = 'C:\Tools\SlikSvn\bin\svn.exe'
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mt) { throw 'Windows SDK manifest tool not found' }
          $manifest = Join-Path $env:RUNNER_TEMP 'svn-utf8.manifest'
          & $mt.FullName "-inputresource:$svn;#1" "-out:$manifest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $xml = [System.Xml.XmlDocument]::new()
          $xml.Load($manifest)
          $application = $xml.SelectSingleNode("//*[local-name()='application']")
          if (-not $application) {
            $application = $xml.CreateElement('application', 'urn:schemas-microsoft-com:asm.v3')
            [void]$xml.DocumentElement.AppendChild($application)
          }
          $settings = $application.SelectSingleNode("*[local-name()='windowsSettings']")
          if (-not $settings) {
            $settings = $xml.CreateElement('windowsSettings', $application.NamespaceURI)
            [void]$application.AppendChild($settings)
          }
          $codePage = $xml.CreateElement('activeCodePage', 'http://schemas.microsoft.com/SMI/2019/WindowsSettings')
          $codePage.InnerText = 'UTF-8'
          [void]$settings.AppendChild($codePage)
          $xml.Save($manifest)
          & $mt.FullName '-manifest' $manifest "-outputresource:$svn;#1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $svn --version --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install SVN on macOS
        if: startsWith(matrix.platform, 'macos-')
        run: brew install subversion
      - name: Verify macOS runner architecture
        if: startsWith(matrix.platform, 'macos-')
        run: |
          expected_arch=arm64
          if [[ "${{ matrix.platform }}" == "macos-15-intel" ]]; then expected_arch=x86_64; fi
          test "$(uname -m)" = "$expected_arch"
      - run: npm ci
      - name: Generate app icons
        run: npm run icons
      - name: Verify SVN test tools
        run: |
          svn --version --quiet
          svnadmin --version --quiet
      - name: Build and run regression checks
        run: npm run check
      - name: Build installers before creating a tag
        # Build only: without releaseId/tagName this action cannot publish.
        # Keep its supported macOS DMG environment and retry transient bundling failures.
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          retryAttempts: 2
          args: ${{ matrix.platform == 'macos-15-intel' && '--target x86_64-apple-darwin --verbose' || matrix.platform == 'macos-15' && '--target aarch64-apple-darwin --verbose' || '--verbose' }}

      - name: Verify macOS ad-hoc signature
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          target=aarch64-apple-darwin
          if [[ "${{ matrix.platform }}" == "macos-15-intel" ]]; then target=x86_64-apple-darwin; fi
          app_bundle="src-tauri/target/$target/release/bundle/macos/StoneSVN.app"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          signature_info=$(codesign -dv --verbose=4 "$app_bundle" 2>&1)
          echo "$signature_info"
          [[ "$signature_info" == *"Signature=adhoc"* ]]

      - name: Collect and validate platform assets
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/collect-release-assets.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Tag and publish only after every platform succeeds
    needs: [plan, desktop]
    if: inputs.validate_only != true
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete release asset set
        run: node scripts/collect-release-assets.cjs --verify
      - name: Create immutable tag and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          # Do not release a superseded candidate after a long matrix run.
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SOURCE_SHA"
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/draft" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/draft")" = true
          fi
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" 2>/dev/null || true
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$SOURCE_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" "$SOURCE_SHA" -m "StoneSVN $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --latest=false --title "StoneSVN $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release edit "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          # Validate uploaded names and sizes before making the draft public.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$RELEASE_TAG\")" > release-upload.json
          node scripts/collect-release-assets.cjs --verify-upload release-upload.json
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
