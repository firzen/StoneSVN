name: Tauri Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (vX.Y.Z)
        required: true
        type: string
  push:
    tags:
      - "v*"
      - "!v*-*"

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "lts/*"
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: Validate version and prepare draft
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate tag and package versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/validate-release.cjs
          test -f "docs/releases/$RELEASE_TAG.md"
      - name: Create or reuse release draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json id >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "::error::This release is already published. Use a new tag for another release."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --prerelease=false --latest=false --notes-file "docs/releases/$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --latest=false --notes-file "docs/releases/$RELEASE_TAG.md" --title "StoneSVN $RELEASE_TAG"
          fi
          # A newly created draft can take a moment to appear in the REST list.
          release_id=""
          for attempt in 1 2 3 4 5; do
            release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
            if [[ "$release_id" =~ ^[0-9]+$ ]]; then break; fi
            sleep 2
          done
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not resolve a unique numeric release ID."
            exit 1
          fi
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Test and build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf subversion
      - name: Install SVN on Windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install sliksvn --version=1.14.5 --no-progress -y --package-parameters="/InstallDir=C:\Tools\SlikSvn"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $svnBin = 'C:\Tools\SlikSvn\bin'
          foreach ($tool in @('svn.exe', 'svnadmin.exe')) {
            $executable = Join-Path $svnBin $tool
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "SVN installation is missing $executable"
            }
            & $executable --version --quiet
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $svnBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Enable UTF-8 in the CI SVN process
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # The English hosted runner uses an ANSI code page. SlikSVN 1.14
          # needs a per-process UTF-8 manifest for multilingual CLI arguments.
          # Only the disposable test tool is changed; SVN is not bundled.
          $svn = 'C:\Tools\SlikSvn\bin\svn.exe'
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mt) { throw 'Windows SDK manifest tool not found' }
          $manifest = Join-Path $env:RUNNER_TEMP 'svn-utf8.manifest'
          & $mt.FullName "-inputresource:$svn;#1" "-out:$manifest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $xml = [System.Xml.XmlDocument]::new()
          $xml.Load($manifest)
          $application = $xml.SelectSingleNode("//*[local-name()='application']")
          if (-not $application) {
            $application = $xml.CreateElement('application', 'urn:schemas-microsoft-com:asm.v3')
            [void]$xml.DocumentElement.AppendChild($application)
          }
          $settings = $application.SelectSingleNode("*[local-name()='windowsSettings']")
          if (-not $settings) {
            $settings = $xml.CreateElement('windowsSettings', $application.NamespaceURI)
            [void]$application.AppendChild($settings)
          }
          $codePage = $xml.CreateElement('activeCodePage', 'http://schemas.microsoft.com/SMI/2019/WindowsSettings')
          $codePage.InnerText = 'UTF-8'
          [void]$settings.AppendChild($codePage)
          $xml.Save($manifest)
          & $mt.FullName '-manifest' $manifest "-outputresource:$svn;#1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $svn --version --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install SVN on macOS
        if: startsWith(matrix.platform, 'macos-')
        run: brew install subversion
      - name: Verify macOS runner architecture
        if: startsWith(matrix.platform, 'macos-')
        run: |
          expected_arch=arm64
          if [[ "${{ matrix.platform }}" == "macos-15-intel" ]]; then expected_arch=x86_64; fi
          test "$(uname -m)" = "$expected_arch"
      - run: npm ci
      - name: Generate app icons
        run: npm run icons
      - name: Verify SVN test tools
        run: |
          svn --version --quiet
          svnadmin --version --quiet
      - name: Build and run regression checks
        run: npm run check
      - name: Build and upload installers to draft
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          # Stable versions support both Windows NSIS and MSI installers.
          args: ${{ matrix.platform == 'macos-15-intel' && '--target x86_64-apple-darwin' || matrix.platform == 'macos-15' && '--target aarch64-apple-darwin' || '' }}

  publish:
    name: Publish complete release
    needs: [prepare, desktop]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish after all platforms succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
