name: Stable Release
run-name: "${{ inputs.validate_only && 'Validate' || 'Release' }} stable · ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Check and build all platforms without creating a tag or release
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/tauri.conf.json
      - docs/releases/**

permissions:
  contents: read

# Serialize publishing; independent dry-run candidates can be checked concurrently.
concurrency:
  group: ${{ inputs.validate_only && format('release-check-{0}', github.sha) || 'stable-release' }}
  cancel-in-progress: false

env:
  NODE_VERSION: "lts/*"
  RUST_BACKTRACE: 1

jobs:
  plan:
    name: Pin candidate and validate release metadata
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      proceed: ${{ steps.plan.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check candidate without creating tags
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE_ONLY: ${{ inputs.validate_only || false }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          tag="v$(node -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Already published versions are ordinary main-branch development.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate > "$RUNNER_TEMP/releases.json"
          published=$(jq --arg tag "$tag" '[.[] | select(.tag_name == $tag and .draft == false)] | length' "$RUNNER_TEMP/releases.json")
          if [ "$published" != 0 ] && [ "$VALIDATE_ONLY" != true ]; then
            echo "Version $tag is already published; no release required."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run release:check -- "$tag"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  desktop:
    name: Test and build (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.proceed == 'true'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-26, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # Keep complete test + packaging dependencies separate from CI/prerelease
          # jobs. An exact cache hit is immutable, even if it lacks a build target.
          shared-key: stable-release-v1-${{ matrix.platform }}
          cache-on-failure: false
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Probe mirrors before apt so DNS outages fail quickly or use a
          # reachable mirror rather than stalling once for every package.
          mirror=''
          for candidate in https://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu https://mirror.math.princeton.edu/pub/ubuntu; do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "$candidate/dists/jammy/InRelease" -o /dev/null; then
              mirror="$candidate"
              break
            fi
          done
          test -n "$mirror" || { echo 'No Ubuntu mirror is reachable'; exit 1; }
          printf '%s\n' "$mirror" | sudo tee /etc/apt/apt-mirrors.txt
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          # curl honors these environment proxies; apt requires explicit options.
          if [ -n "${HTTPS_PROXY:-${https_proxy:-}}" ]; then
            apt_options+=(-o "Acquire::https::Proxy=${HTTPS_PROXY:-$https_proxy}")
          fi
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf subversion rpm2cpio cpio squashfs-tools
      - name: Install SVN on Windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install sliksvn --version=1.14.5 --no-progress -y --package-parameters="/InstallDir=C:\Tools\SlikSvn"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $svnBin = 'C:\Tools\SlikSvn\bin'
          foreach ($tool in @('svn.exe', 'svnadmin.exe')) {
            $executable = Join-Path $svnBin $tool
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "SVN installation is missing $executable"
            }
            & $executable --version --quiet
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $svnBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Enable UTF-8 in the CI SVN process
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # The English hosted runner uses an ANSI code page. SlikSVN 1.14
          # needs a per-process UTF-8 manifest for multilingual CLI arguments.
          # Only the disposable test tool is changed; SVN is not bundled.
          $svn = 'C:\Tools\SlikSvn\bin\svn.exe'
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mt) { throw 'Windows SDK manifest tool not found' }
          $manifest = Join-Path $env:RUNNER_TEMP 'svn-utf8.manifest'
          & $mt.FullName "-inputresource:$svn;#1" "-out:$manifest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $xml = [System.Xml.XmlDocument]::new()
          $xml.Load($manifest)
          $application = $xml.SelectSingleNode("//*[local-name()='application']")
          if (-not $application) {
            $application = $xml.CreateElement('application', 'urn:schemas-microsoft-com:asm.v3')
            [void]$xml.DocumentElement.AppendChild($application)
          }
          $settings = $application.SelectSingleNode("*[local-name()='windowsSettings']")
          if (-not $settings) {
            $settings = $xml.CreateElement('windowsSettings', $application.NamespaceURI)
            [void]$application.AppendChild($settings)
          }
          $codePage = $xml.CreateElement('activeCodePage', 'http://schemas.microsoft.com/SMI/2019/WindowsSettings')
          $codePage.InnerText = 'UTF-8'
          [void]$settings.AppendChild($codePage)
          $xml.Save($manifest)
          & $mt.FullName '-manifest' $manifest "-outputresource:$svn;#1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $svn --version --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install SVN on macOS
        if: startsWith(matrix.platform, 'macos-')
        run: brew install subversion
      - name: Verify macOS runner architecture
        if: startsWith(matrix.platform, 'macos-')
        run: |
          expected_arch=arm64
          if [[ "${{ matrix.platform }}" == "macos-15-intel" ]]; then expected_arch=x86_64; fi
          test "$(uname -m)" = "$expected_arch"
      - run: npm ci
      - name: Generate app icons
        run: npm run icons
      - name: Verify SVN test tools
        run: |
          svn --version --quiet
          svnadmin --version --quiet
      - name: Build and run regression checks
        run: npm run check
      - name: Stage Windows SVN runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/stage-windows-svn.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'svn-runtime')
      - name: Stage Unix SVN runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            python3 scripts/stage-macos-svn.py "$RUNNER_TEMP/svn-runtime"
          else
            python3 scripts/stage-linux-svn.py "$RUNNER_TEMP/svn-runtime"
          fi
      - name: Configure Tauri to include the private SVN runtime
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('node:fs')
          const path = require('node:path')
          const runtime = path.join(process.env.RUNNER_TEMP, 'svn-runtime')
          fs.mkdirSync('src-tauri/target', { recursive: true })
          const config = JSON.parse(fs.readFileSync('src-tauri/tauri.ci.conf.json', 'utf8'))
          config.bundle = { resources: { [runtime]: 'svn-runtime/' } }
          fs.writeFileSync('src-tauri/target/svn-bundle.conf.json', JSON.stringify(config))
          JS
      - name: Build installers before creating a tag
        # Build only: without releaseId/tagName this action cannot publish.
        # Keep its supported macOS DMG environment and retry transient bundling failures.
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          retryAttempts: 2
          # npm run check already built and type-checked dist in this checkout.
          args: --config src-tauri/target/svn-bundle.conf.json ${{ matrix.platform == 'macos-15-intel' && '--target x86_64-apple-darwin --verbose' || matrix.platform == 'macos-26' && '--target aarch64-apple-darwin --verbose' || '--verbose' }}

      - name: Verify macOS ad-hoc signature
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          target=aarch64-apple-darwin
          if [[ "${{ matrix.platform }}" == "macos-15-intel" ]]; then target=x86_64-apple-darwin; fi
          app_bundle="src-tauri/target/$target/release/bundle/macos/StoneSVN.app"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          signature_info=$(codesign -dv --verbose=4 "$app_bundle" 2>&1)
          echo "$signature_info"
          [[ "$signature_info" == *"Signature=adhoc"* ]]

          node scripts/check-bundled-svn.cjs "$app_bundle/Contents/Resources/svn-runtime/svn" "$(command -v svnadmin)"

      - name: Verify bundled SVN in the Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $admin = (Get-Command svnadmin.exe).Source
          $bundle = 'src-tauri/target/release/bundle'
          $exe = @(Get-ChildItem "$bundle/nsis/*-setup.exe")
          $msi = @(Get-ChildItem "$bundle/msi/*.msi")
          if ($exe.Count -ne 1 -or $msi.Count -ne 1) { throw 'Expected one NSIS installer and one MSI' }
          $nsisDir = Join-Path $env:RUNNER_TEMP 'StoneSVN-NSIS'
          $result = Start-Process $exe[0].FullName -ArgumentList "/S /D=$nsisDir" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "NSIS install failed: $($result.ExitCode)" }
          node scripts/check-bundled-svn.cjs "$nsisDir/svn-runtime/svn.exe" $admin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $msiDir = Join-Path $env:RUNNER_TEMP 'StoneSVN-MSI'
          $result = Start-Process msiexec.exe -ArgumentList "/a `"$($msi[0].FullName)`" /qn TARGETDIR=`"$msiDir`"" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "MSI extraction failed: $($result.ExitCode)" }
          $client = @(Get-ChildItem -LiteralPath $msiDir -Recurse -File -Filter svn.exe)
          if ($client.Count -ne 1) { throw 'Expected one bundled SVN client in the MSI' }
          node scripts/check-bundled-svn.cjs $client[0].FullName $admin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify bundled SVN in the Linux installers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bundle="$(realpath src-tauri/target/release/bundle)"
          for format in deb rpm appimage; do
            echo "Checking bundled SVN in $format"
            destination="$RUNNER_TEMP/StoneSVN-$format"
            case "$format" in
              deb) dpkg-deb -x "$bundle"/deb/*.deb "$destination" ;;
              rpm)
                mkdir -p "$destination"
                (cd "$destination" && rpm2cpio "$bundle"/rpm/*.rpm | cpio -id --quiet)
                ;;
              appimage)
                images=("$bundle"/appimage/*.AppImage)
                test "${#images[@]}" = 1
                image="${images[0]}"
                offset="$("$image" --appimage-offset)"
                unsquashfs -no-progress -o "$offset" -d "$destination" "$image"
                ;;
            esac
            client="$(find "$destination" -path '*/svn-runtime/svn' -print)"
            if [[ ! -x "$client" ]]; then
              echo "::error::No executable bundled SVN found in $format"
              exit 1
            fi
            node scripts/check-bundled-svn.cjs "$client" "$(command -v svnadmin)"
          done

      - name: Collect and validate platform assets
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/collect-release-assets.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Tag and publish only after every platform succeeds
    needs: [plan, desktop]
    if: inputs.validate_only != true
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete release asset set
        run: node scripts/collect-release-assets.cjs --verify
      - name: Create immutable tag and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          # Do not release a superseded candidate after a long matrix run.
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SOURCE_SHA"
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/draft" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/draft")" = true
          fi
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" 2>/dev/null || true
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$SOURCE_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" "$SOURCE_SHA" -m "StoneSVN $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --latest=false --title "StoneSVN $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release edit "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          # Validate uploaded names and sizes before making the draft public.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$RELEASE_TAG\")" > release-upload.json
          node scripts/collect-release-assets.cjs --verify-upload release-upload.json
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
