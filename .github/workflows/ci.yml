name: CI

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate before tagging a release
        type: choice
        default: ubuntu-22.04
        options:
          - ubuntu-22.04
          - windows-latest
          - macos-26
          - macos-15-intel
      bundled_svn:
        description: Build and verify an installer with a private SVN runtime
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform || 'ubuntu-22.04' }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: ${{ inputs.platform || 'ubuntu-22.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf subversion

      - name: Install SVN on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install sliksvn --version=1.14.5 --no-progress -y --package-parameters="/InstallDir=C:\Tools\SlikSvn"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $svnBin = 'C:\Tools\SlikSvn\bin'
          foreach ($tool in @('svn.exe', 'svnadmin.exe')) {
            $executable = Join-Path $svnBin $tool
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "SVN installation is missing $executable"
            }
            & $executable --version --quiet
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $svnBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Enable UTF-8 in the CI SVN process
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The English hosted runner uses an ANSI code page. SlikSVN 1.14
          # needs a per-process UTF-8 manifest for multilingual CLI arguments.
          # Only the disposable test tool is changed; SVN is not bundled.
          $svn = 'C:\Tools\SlikSvn\bin\svn.exe'
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mt) { throw 'Windows SDK manifest tool not found' }
          $manifest = Join-Path $env:RUNNER_TEMP 'svn-utf8.manifest'
          & $mt.FullName "-inputresource:$svn;#1" "-out:$manifest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $xml = [System.Xml.XmlDocument]::new()
          $xml.Load($manifest)
          $application = $xml.SelectSingleNode("//*[local-name()='application']")
          if (-not $application) {
            $application = $xml.CreateElement('application', 'urn:schemas-microsoft-com:asm.v3')
            [void]$xml.DocumentElement.AppendChild($application)
          }
          $settings = $application.SelectSingleNode("*[local-name()='windowsSettings']")
          if (-not $settings) {
            $settings = $xml.CreateElement('windowsSettings', $application.NamespaceURI)
            [void]$application.AppendChild($settings)
          }
          $codePage = $xml.CreateElement('activeCodePage', 'http://schemas.microsoft.com/SMI/2019/WindowsSettings')
          $codePage.InnerText = 'UTF-8'
          [void]$settings.AppendChild($codePage)
          $xml.Save($manifest)
          & $mt.FullName '-manifest' $manifest "-outputresource:$svn;#1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $svn --version --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install SVN on macOS
        if: runner.os == 'macOS'
        run: brew install subversion

      - name: Install frontend dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build and verify Windows installer with SVN
        if: inputs.bundled_svn && runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'svn-runtime'
          $null = & ./scripts/stage-windows-svn.ps1 -Destination $runtime
          npm run build:with-svn -- $runtime --config src-tauri/tauri.ci.conf.json --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'StoneSVN'
          $process = Start-Process $installer[0].FullName -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          node scripts/check-bundled-svn.cjs "$destination/svn-runtime/svn.exe" (Get-Command svnadmin.exe).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify macOS app with SVN
        if: inputs.bundled_svn && runner.os == 'macOS'
        run: |
          python3 scripts/stage-macos-svn.py "$RUNNER_TEMP/svn-runtime"
          npm run build:with-svn -- "$RUNNER_TEMP/svn-runtime" --config src-tauri/tauri.ci.conf.json --bundles app
          app=src-tauri/target/release/bundle/macos/StoneSVN.app
          codesign --verify --strict --deep "$app"
          node scripts/check-bundled-svn.cjs "$app/Contents/Resources/svn-runtime/svn" "$(command -v svnadmin)"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/StoneSVN.app.zip"

      - name: Build and verify Linux package with SVN
        if: inputs.bundled_svn && runner.os == 'Linux'
        run: |
          python3 scripts/stage-linux-svn.py "$RUNNER_TEMP/svn-runtime"
          npm run build:with-svn -- "$RUNNER_TEMP/svn-runtime" --config src-tauri/tauri.ci.conf.json --bundles deb
          dpkg-deb -x src-tauri/target/release/bundle/deb/*.deb "$RUNNER_TEMP/StoneSVN"
          client="$(find "$RUNNER_TEMP/StoneSVN/usr/lib" -path '*/svn-runtime/svn' -type f)"
          node scripts/check-bundled-svn.cjs "$client" "$(command -v svnadmin)"

      - name: Upload verified SVN bundle
        if: inputs.bundled_svn
        uses: actions/upload-artifact@v4
        with:
          name: StoneSVN-with-SVN-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/deb/*.deb
            ${{ runner.temp }}/StoneSVN.app.zip
